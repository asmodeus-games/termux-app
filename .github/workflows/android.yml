name: Android Build

on:
  push:
    branches: [main, master, ssh-integration]
    tags: ['v*']
  pull_request:
    branches: [main, master, ssh-integration]

permissions:
  contents: write

env:
  ANDROID_SDK_VERSION: 36
  GRADLE_VERSION: 8.13
  TERMUX_PACKAGE_VARIANT: apt-android-7

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install additional SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Termux bootstrap packages
        run: ./gradlew downloadBootstraps --no-daemon -q

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -q

      - name: Build Release APK (on tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:assembleRelease --no-daemon -q

      - name: Upload Debug APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termux-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APKs as Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: termux-release-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Prepare GitHub Pages deployment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          # Create a temp directory for gh-pages content
          mkdir -p gh-pages-content
          # Copy APKs
          cp app/build/outputs/apk/debug/*.apk gh-pages-content/
          # Copy index.html
          cp index.html gh-pages-content/
          # Create a .nojekyll file to prevent Jekyll processing
          touch gh-pages-content/.nojekyll

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-content
          publish_branch: gh-pages
          keep_files: true
          force_orphan: true

  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install additional SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew :app:lintDebug --no-daemon -q

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :ssh-integration:test --no-daemon -q